name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nasty-telemetry-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-worker:
    name: Deploy Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: worker
        run: npm ci

      - name: Test worker
        working-directory: worker
        run: npm test

      - name: Typecheck worker
        working-directory: worker
        run: npm run typecheck

      - name: Apply database indexes
        working-directory: worker
        run: npx wrangler d1 execute nasty-telemetry --remote --command "CREATE INDEX IF NOT EXISTS idx_telemetry_reported_at ON telemetry (reported_at, instance_id);"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Worker
        working-directory: worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-site:
    name: Deploy Pages
    needs: deploy-worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy site --project-name=nasty-telemetry
