<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NASty Telemetry</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f1117;
      color: #e0e0e0;
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 2.5rem;
      padding: 1.5rem 0;
    }
    .header img { height: 8rem; margin-bottom: 0.8rem; }
    .header .subtitle {
      color: #888;
      font-size: 0.9rem;
      margin-top: 0.4rem;
    }
    .header .subtitle a { color: #818cf8; text-decoration: none; }
    .header .subtitle a:hover { text-decoration: underline; }
    h1 { font-size: 2rem; }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: #1a1d27;
      border: 1px solid #2a2d37;
      border-radius: 10px;
      padding: 1.4rem;
      text-align: center;
    }
    .stat-card .label {
      color: #666;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .stat-card .value {
      font-size: 2.2rem;
      font-weight: 700;
      margin-top: 0.4rem;
      background: linear-gradient(135deg, #e0e0e0 0%, #a0a0a0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .stat-card .meta {
      min-height: 1rem;
      margin-top: 0.45rem;
      color: #666;
      font-size: 0.72rem;
    }
    .stat-card .meta.positive { color: #6ee7b7; }
    .stat-card .meta.negative { color: #fca5a5; }
    .fleet-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      margin-bottom: 2rem;
      overflow: hidden;
      border: 1px solid #2a2d37;
      border-radius: 10px;
      background: #151821;
    }
    .fleet-average {
      padding: 1rem 1.2rem;
      border-right: 1px solid #2a2d37;
    }
    .fleet-average:last-child { border-right: 0; }
    .fleet-average .label {
      color: #666;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .fleet-average .value {
      margin-top: 0.25rem;
      color: #ddd;
      font-size: 1.05rem;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
    }
    .fleet-average .detail {
      display: block;
      margin-top: 0.2rem;
      color: #666;
      font-size: 0.7rem;
      font-weight: 400;
    }
    .protocol-section { margin-bottom: 1rem; }
    .protocol-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.75rem;
    }
    .protocol-card {
      padding: 1rem;
      border: 1px solid #2a2d37;
      border-radius: 8px;
      background: #151821;
    }
    .protocol-card .name {
      color: #999;
      font-size: 0.75rem;
      font-weight: 650;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .protocol-card .value {
      margin-top: 0.35rem;
      color: #ddd;
      font-size: 1.35rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .protocol-card .detail {
      min-height: 2rem;
      margin-top: 0.2rem;
      color: #666;
      font-size: 0.68rem;
      line-height: 1.45;
    }
    .protocol-bar {
      height: 0.35rem;
      margin-top: 0.65rem;
      overflow: hidden;
      border-radius: 999px;
      background: #2a2d37;
    }
    .protocol-bar span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
    }
    .charts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    @media (max-width: 768px) {
      .charts { grid-template-columns: 1fr; }
      .stats { grid-template-columns: 1fr 1fr; }
    }
    .chart-container {
      background: #1a1d27;
      border: 1px solid #2a2d37;
      border-radius: 10px;
      padding: 1.5rem;
    }
    .chart-container.full { grid-column: 1 / -1; }
    .chart-container h2 {
      font-size: 0.95rem;
      font-weight: 600;
      color: #999;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .chart-note {
      margin: -0.6rem 0 1rem;
      color: #666;
      font-size: 0.72rem;
    }
    .chart-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .chart-heading h2 { margin-bottom: 0; }
    .sort-toggle {
      display: inline-flex;
      padding: 2px;
      border: 1px solid #343746;
      border-radius: 7px;
      background: #12141c;
    }
    .sort-toggle button {
      border: 0;
      border-radius: 5px;
      padding: 0.3rem 0.55rem;
      background: transparent;
      color: #777;
      font: inherit;
      font-size: 0.72rem;
      cursor: pointer;
    }
    .sort-toggle button:hover { color: #ccc; }
    .sort-toggle button:focus-visible {
      outline: 2px solid #818cf8;
      outline-offset: 1px;
    }
    .sort-toggle button.active {
      background: #2a2d3d;
      color: #c4b5fd;
    }
    .loading { color: #555; text-align: center; padding: 4rem; font-size: 0.95rem; }
    .error { color: #ef4444; text-align: center; padding: 4rem; }
    canvas { max-height: 220px; }
    .breakdown {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .distribution-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 1rem;
    }
    @media (max-width: 768px) {
      .breakdown { grid-template-columns: 1fr; }
      .distribution-grid { grid-template-columns: 1fr; }
      .fleet-strip { grid-template-columns: 1fr 1fr; }
      .protocol-grid { grid-template-columns: 1fr 1fr; }
      .fleet-average:nth-child(2) { border-right: 0; }
      .fleet-average:nth-child(-n + 2) { border-bottom: 1px solid #2a2d37; }
    }
    .bar-list { display: flex; flex-direction: column; gap: 0.6rem; }
    .bar-row {
      display: grid;
      grid-template-columns: 6rem 1fr 3rem;
      align-items: center;
      gap: 0.7rem;
      font-size: 0.9rem;
    }
    .bar-row .name { color: #ccc; font-variant-numeric: tabular-nums; }
    .bar-row .bar {
      height: 0.6rem;
      background: #2a2d37;
      border-radius: 999px;
      overflow: hidden;
    }
    .bar-row .bar > div {
      height: 100%;
      background: linear-gradient(90deg, #818cf8 0%, #c4b5fd 100%);
      border-radius: 999px;
    }
    .bar-row .count {
      color: #888;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .footnote {
      padding: 1.5rem 0 0.5rem;
      color: #555;
      font-size: 0.72rem;
      line-height: 1.6;
      text-align: center;
    }
    @media (max-width: 480px) {
      body { padding: 1rem; }
      .stats { grid-template-columns: 1fr; }
      .protocol-grid { grid-template-columns: 1fr; }
      .header { margin-bottom: 1.5rem; }
      .header img { height: 6rem; }
      .stat-card, .chart-container { padding: 1.1rem; }
      .bar-row { grid-template-columns: 5rem 1fr 2rem; gap: 0.5rem; }
    }
  </style>
</head>
<body>
  <div class="header">
    <a href="https://github.com/nasty-project">
      <img src="logo.svg" alt="NASty" />
    </a>
    <h1>Telemetry</h1>
    <p class="subtitle">Aggregated usage statistics from reporting <a href="https://github.com/nasty-project">NASty</a> instances</p>
  </div>

  <div id="content" class="loading">Loading...</div>

  <script>
    const API_BASE = 'https://nasty-telemetry.nasty-project.workers.dev/api';

    function formatBytes(bytes) {
      if (bytes === 0) return '0 B';
      const units = ['B', 'KiB', 'MiB', 'GiB', 'TiB', 'PiB'];
      const i = Math.floor(Math.log(bytes) / Math.log(1024));
      return (bytes / Math.pow(1024, i)).toFixed(1) + ' ' + units[i];
    }

    function makeChart(canvasId, labels, series, opts = {}) {
      const ctx = document.getElementById(canvasId).getContext('2d');
      const allValues = series.flatMap(item => item.data);
      const isInteger = allValues.every(v => Number.isInteger(v));
      const maxVal = Math.max(...allValues, 0);

      new Chart(ctx, {
        type: opts.type || 'line',
        data: {
          labels,
          datasets: series.map(item => ({
            label: item.label,
            data: item.data,
            borderColor: item.color,
            backgroundColor: item.background || item.color + (opts.type === 'bar' ? '80' : '30'),
            borderWidth: opts.type === 'bar' ? 0 : (item.borderWidth ?? 2),
            fill: item.fill ?? false,
            tension: 0.15,
            pointRadius: opts.points ? 2 : 0,
            pointHoverRadius: 5,
            borderRadius: opts.type === 'bar' ? 4 : 0,
          })),
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          interaction: { intersect: false, mode: 'index' },
          scales: {
            x: {
              stacked: opts.stacked || false,
              ticks: { color: '#555', font: { size: 11 } },
              grid: { color: '#1f2230' },
              border: { color: '#2a2d37' },
            },
            y: {
              beginAtZero: true,
              stacked: opts.stacked || false,
              max: opts.yMax,
              ticks: {
                color: '#555',
                font: { size: 11 },
                callback: opts.yFormat || (v => isInteger ? (Number.isInteger(v) ? v : '') : v),
                maxTicksLimit: 6,
              },
              grid: { color: '#1f2230' },
              border: { color: '#2a2d37' },
              suggestedMax: isInteger ? maxVal + 1 : undefined,
            },
          },
          plugins: {
            legend: {
              display: series.length > 1,
              labels: { color: '#888', boxWidth: 10, boxHeight: 10, usePointStyle: true },
            },
            tooltip: {
              backgroundColor: '#1a1d27',
              borderColor: '#2a2d37',
              borderWidth: 1,
              titleColor: '#888',
              bodyColor: '#e0e0e0',
              bodyFont: { weight: '600' },
              padding: 10,
              displayColors: series.length > 1,
              callbacks: {
                label: (context) => {
                  const value = opts.yFormat ? opts.yFormat(context.parsed.y) : context.parsed.y;
                  return series.length > 1 ? `${context.dataset.label}: ${value}` : String(value);
                },
              },
            },
          },
        },
      });
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }

    function compareVersionLabels(a, b) {
      const parse = label => {
        const match = String(label).match(/^(\d+)\.(\d+)\.(\d+)(?:[-+].*)?$/);
        return match ? match.slice(1).map(Number) : null;
      };
      const left = parse(a);
      const right = parse(b);
      if (left && right) {
        for (let i = 0; i < 3; i++) {
          if (left[i] !== right[i]) return right[i] - left[i];
        }
      } else if (left) {
        return -1;
      } else if (right) {
        return 1;
      }
      return String(b).localeCompare(String(a), undefined, { numeric: true });
    }

    function sortVersions(versions, sortBy) {
      return [...versions].sort((a, b) => {
        if (sortBy === 'count') {
          return b.instances - a.instances || compareVersionLabels(a.version, b.version);
        }
        return compareVersionLabels(a.version, b.version) || b.instances - a.instances;
      });
    }

    function sevenDayDelta(days, key) {
      if (days.length < 8) return null;
      return days[days.length - 1][key] - days[days.length - 8][key];
    }

    function renderStatCard(label, value, delta, formatter = value => value.toLocaleString(), detail = '') {
      let meta = 'Not enough history';
      let metaClass = '';
      if (delta !== null) {
        meta = delta === 0 ? 'No change in 7 days' : `${delta > 0 ? '+' : '-'}${formatter(Math.abs(delta))} in 7 days`;
        metaClass = delta > 0 ? 'positive' : delta < 0 ? 'negative' : '';
      }
      if (detail) meta = `${detail} | ${meta}`;
      return `
        <div class="stat-card">
          <div class="label">${label}</div>
          <div class="value">${value}</div>
          <div class="meta ${metaClass}">${meta}</div>
        </div>
      `;
    }

    function adoptionDetail(metric, noun) {
      if (!metric?.reporting) return 'No observed reports';
      return `${Math.round((metric.using / metric.reporting) * 100)}% of reporting instances use ${noun}`;
    }

    function renderProtocolCard(name, metric, unit) {
      if (!metric?.reporting) {
        return `
          <div class="protocol-card">
            <div class="name">${name}</div>
            <div class="value">No reports</div>
            <div class="detail">No upgraded instances have reported this metric yet</div>
            <div class="protocol-bar"><span style="width:0%"></span></div>
          </div>
        `;
      }
      const percent = metric.reporting > 0 ? (metric.using / metric.reporting) * 100 : 0;
      return `
        <div class="protocol-card">
          <div class="name">${name}</div>
          <div class="value">${percent.toFixed(0)}%</div>
          <div class="detail">${metric.using} of ${metric.reporting} instances | ${metric.configured} configured ${unit}</div>
          <div class="protocol-bar"><span style="width:${percent}%"></span></div>
        </div>
      `;
    }

    function renderBarList(entries, keyName) {
      if (!entries || entries.length === 0) return '<p class="loading" style="padding:1rem;">No data yet.</p>';
      const max = Math.max(...entries.map(e => e.instances));
      return `<div class="bar-list">${entries.map(e => {
        const pct = max > 0 ? (e.instances / max) * 100 : 0;
        return `
          <div class="bar-row">
            <span class="name">${escapeHtml(e[keyName])}</span>
            <span class="bar"><div style="width:${pct}%"></div></span>
            <span class="count">${e.instances}</span>
          </div>
        `;
      }).join('')}</div>`;
    }

    async function load() {
      try {
        const res = await fetch(`${API_BASE}/stats`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const { days, latest: latestBreakdown } = await res.json();

        if (!days || days.length === 0) {
          document.getElementById('content').innerHTML = '<p class="loading">No data yet. Check back once NASty instances start reporting.</p>';
          return;
        }

        const latest = days[days.length - 1];
        const labels = days.map(d => d.day);
        const versions = latestBreakdown?.versions ?? [];
        const arches = latestBreakdown?.arches ?? [];
        const distributions = latestBreakdown?.distributions ?? { drives: [], capacity: [], utilization: [] };
        const adoption = latestBreakdown?.adoption ?? {
          vms: { reporting: latest.instances, using: 0 },
          apps: { reporting: latest.instances, using: 0 },
        };
        const protocols = latestBreakdown?.protocols ?? {
          smb: { reporting: 0, using: 0, configured: 0 },
          nfs: { reporting: 0, using: 0, configured: 0 },
          iscsi: { reporting: 0, using: 0, configured: 0 },
          nvmeof: { reporting: 0, using: 0, configured: 0 },
        };
        const utilization = latest.total_bytes > 0 ? (latest.used_bytes / latest.total_bytes) * 100 : 0;
        const versionNames = [...new Set(days.flatMap(day => Object.keys(day.versions ?? {})))].sort(compareVersionLabels);
        const versionColors = ['#c4b5fd', '#818cf8', '#38bdf8', '#34d399', '#fbbf24', '#fb7185', '#a3e635', '#f472b6'];
        const instanceDivisor = latest.instances || 1;
        const vmDivisor = latest.vms_reporting || instanceDivisor;
        const appDivisor = latest.apps_reporting || instanceDivisor;

        const content = document.getElementById('content');
        content.classList.remove('loading');
        content.innerHTML = `
          <div class="stats">
            ${renderStatCard('Active Instances', latest.instances.toLocaleString(), sevenDayDelta(days, 'instances'))}
            ${renderStatCard('Total Drives', latest.drives.toLocaleString(), sevenDayDelta(days, 'drives'))}
            ${renderStatCard('Managed Storage', formatBytes(latest.total_bytes), sevenDayDelta(days, 'total_bytes'), formatBytes)}
            ${renderStatCard('Storage Used', `${utilization.toFixed(1)}%`, sevenDayDelta(days, 'used_bytes'), formatBytes, formatBytes(latest.used_bytes))}
            ${renderStatCard('Configured VMs', (latest.vms ?? 0).toLocaleString(), sevenDayDelta(days, 'vms'))}
            ${renderStatCard('Installed Apps', (latest.apps ?? 0).toLocaleString(), sevenDayDelta(days, 'apps'))}
          </div>

          <div class="fleet-strip" aria-label="Fleet averages">
            <div class="fleet-average">
              <div class="label">Drives / instance</div>
              <div class="value">${(latest.drives / instanceDivisor).toFixed(1)}</div>
            </div>
            <div class="fleet-average">
              <div class="label">Storage / instance</div>
              <div class="value">${formatBytes(latest.total_bytes / instanceDivisor)}</div>
            </div>
            <div class="fleet-average">
              <div class="label">VMs / reporting instance</div>
              <div class="value">${((latest.vms ?? 0) / vmDivisor).toFixed(1)} <span class="detail">${adoptionDetail(adoption.vms, 'VMs')}</span></div>
            </div>
            <div class="fleet-average">
              <div class="label">Apps / reporting instance</div>
              <div class="value">${((latest.apps ?? 0) / appDivisor).toFixed(1)} <span class="detail">${adoptionDetail(adoption.apps, 'apps')}</span></div>
            </div>
          </div>

          <div class="charts">
            <div class="chart-container">
              <h2>Active Instances</h2>
              <canvas id="chart-instances"></canvas>
            </div>

            <div class="chart-container">
              <h2>Total Drives</h2>
              <canvas id="chart-drives"></canvas>
            </div>

            <div class="chart-container">
              <h2>Storage Utilization</h2>
              <p class="chart-note">Used and available capacity across reporting instances</p>
              <canvas id="chart-storage"></canvas>
            </div>

            <div class="chart-container">
              <h2>Workload Adoption</h2>
              <p class="chart-note">Configured virtual machines and installed apps</p>
              <canvas id="chart-workloads"></canvas>
            </div>

            <div class="chart-container full">
              <h2>Version Adoption</h2>
              <p class="chart-note">Share of active instances grouped by release family</p>
              <canvas id="chart-versions"></canvas>
            </div>
          </div>

          <section class="chart-container protocol-section">
            <h2>Sharing Protocol Adoption</h2>
            <p class="chart-note">Instances with at least one configured export</p>
            <div class="protocol-grid">
              ${renderProtocolCard('SMB', protocols.smb, 'shares')}
              ${renderProtocolCard('NFS', protocols.nfs, 'exports')}
              ${renderProtocolCard('iSCSI', protocols.iscsi, 'LUNs')}
              ${renderProtocolCard('NVMe-oF', protocols.nvmeof, 'namespaces')}
            </div>
          </section>

          <div class="breakdown">
            <div class="chart-container">
              <div class="chart-heading">
                <h2>Versions (active instances)</h2>
                <div class="sort-toggle" role="group" aria-label="Sort versions">
                  <button type="button" class="active" data-version-sort="version" aria-pressed="true">Version</button>
                  <button type="button" data-version-sort="count" aria-pressed="false">Count</button>
                </div>
              </div>
              <div id="version-breakdown">${renderBarList(sortVersions(versions, 'version'), 'version')}</div>
            </div>
            <div class="chart-container">
              <h2>Architecture</h2>
              ${renderBarList(arches, 'arch')}
            </div>
          </div>

          <div class="distribution-grid">
            <div class="chart-container">
              <h2>Drives per instance</h2>
              ${renderBarList(distributions.drives, 'label')}
            </div>
            <div class="chart-container">
              <h2>Capacity per instance</h2>
              ${renderBarList(distributions.capacity, 'label')}
            </div>
            <div class="chart-container">
              <h2>Storage utilization</h2>
              ${renderBarList(distributions.utilization, 'label')}
            </div>
          </div>

          <p class="footnote">
            Active means an instance reported within the last three days. Historical totals use the population active on each day.
            Reports are aggregate and unauthenticated, so counts indicate reporting instances rather than verified installations.
          </p>
        `;

        const versionBreakdown = document.getElementById('version-breakdown');
        const versionSortButtons = document.querySelectorAll('[data-version-sort]');
        versionSortButtons.forEach(button => {
          button.addEventListener('click', () => {
            const sortBy = button.dataset.versionSort;
            versionBreakdown.innerHTML = renderBarList(sortVersions(versions, sortBy), 'version');
            versionSortButtons.forEach(candidate => {
              const active = candidate === button;
              candidate.classList.toggle('active', active);
              candidate.setAttribute('aria-pressed', String(active));
            });
          });
        });

        makeChart('chart-instances', labels, [
          { label: 'Instances', data: days.map(day => day.instances), color: '#818cf8' },
        ], { type: 'bar' });
        makeChart('chart-drives', labels, [
          { label: 'Drives', data: days.map(day => day.drives), color: '#34d399' },
        ], { type: 'bar' });
        makeChart('chart-storage', labels, [
          { label: 'Used', data: days.map(day => day.used_bytes), color: '#fbbf24', fill: true },
          { label: 'Available', data: days.map(day => Math.max(0, day.total_bytes - day.used_bytes)), color: '#34d399', fill: true },
        ], { stacked: true, yFormat: formatBytes });
        makeChart('chart-workloads', labels, [
          { label: 'Apps', data: days.map(day => day.apps ?? 0), color: '#38bdf8' },
          { label: 'VMs', data: days.map(day => day.vms ?? 0), color: '#fb7185' },
        ], { points: true });
        makeChart('chart-versions', labels, versionNames.map((version, index) => ({
          label: version === 'Other' ? 'Older / other' : version,
          data: days.map(day => day.instances > 0 ? ((day.versions?.[version] ?? 0) / day.instances) * 100 : 0),
          color: versionColors[index % versionColors.length],
          borderWidth: 2,
        })), { yMax: 100, yFormat: value => `${Math.round(value)}%` });
      } catch (err) {
        document.getElementById('content').innerHTML = `<p class="error">Failed to load data: ${err.message}</p>`;
      }
    }

    load();
  </script>
</body>
</html>
