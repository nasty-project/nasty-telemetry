<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NASty Telemetry</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f1117;
      color: #e0e0e0;
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 2.5rem;
      padding: 1.5rem 0;
    }
    .header img { height: 8rem; margin-bottom: 0.8rem; }
    .header .subtitle {
      color: #888;
      font-size: 0.9rem;
      margin-top: 0.4rem;
    }
    .header .subtitle a { color: #818cf8; text-decoration: none; }
    .header .subtitle a:hover { text-decoration: underline; }
    h1 { font-size: 2rem; }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: #1a1d27;
      border: 1px solid #2a2d37;
      border-radius: 10px;
      padding: 1.4rem;
      text-align: center;
    }
    .stat-card .label {
      color: #666;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .stat-card .value {
      font-size: 2.2rem;
      font-weight: 700;
      margin-top: 0.4rem;
      background: linear-gradient(135deg, #e0e0e0 0%, #a0a0a0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .charts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    @media (max-width: 768px) {
      .charts { grid-template-columns: 1fr; }
    }
    .chart-container {
      background: #1a1d27;
      border: 1px solid #2a2d37;
      border-radius: 10px;
      padding: 1.5rem;
    }
    .chart-container.full { grid-column: 1 / -1; }
    .chart-container h2 {
      font-size: 0.95rem;
      font-weight: 600;
      color: #999;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .chart-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .chart-heading h2 { margin-bottom: 0; }
    .sort-toggle {
      display: inline-flex;
      padding: 2px;
      border: 1px solid #343746;
      border-radius: 7px;
      background: #12141c;
    }
    .sort-toggle button {
      border: 0;
      border-radius: 5px;
      padding: 0.3rem 0.55rem;
      background: transparent;
      color: #777;
      font: inherit;
      font-size: 0.72rem;
      cursor: pointer;
    }
    .sort-toggle button:hover { color: #ccc; }
    .sort-toggle button:focus-visible {
      outline: 2px solid #818cf8;
      outline-offset: 1px;
    }
    .sort-toggle button.active {
      background: #2a2d3d;
      color: #c4b5fd;
    }
    .loading { color: #555; text-align: center; padding: 4rem; font-size: 0.95rem; }
    .error { color: #ef4444; text-align: center; padding: 4rem; }
    canvas { max-height: 220px; }
    .breakdown {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    @media (max-width: 768px) {
      .breakdown { grid-template-columns: 1fr; }
    }
    .bar-list { display: flex; flex-direction: column; gap: 0.6rem; }
    .bar-row {
      display: grid;
      grid-template-columns: 6rem 1fr 3rem;
      align-items: center;
      gap: 0.7rem;
      font-size: 0.9rem;
    }
    .bar-row .name { color: #ccc; font-variant-numeric: tabular-nums; }
    .bar-row .bar {
      height: 0.6rem;
      background: #2a2d37;
      border-radius: 999px;
      overflow: hidden;
    }
    .bar-row .bar > div {
      height: 100%;
      background: linear-gradient(90deg, #818cf8 0%, #c4b5fd 100%);
      border-radius: 999px;
    }
    .bar-row .count {
      color: #888;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div class="header">
    <a href="https://github.com/nasty-project">
      <img src="logo.svg" alt="NASty" />
    </a>
    <h1>Telemetry</h1>
    <p class="subtitle">Anonymous, aggregated usage statistics from <a href="https://github.com/nasty-project">NASty</a> instances</p>
  </div>

  <div id="content" class="loading">Loading...</div>

  <script>
    const API_BASE = 'https://nasty-telemetry.nasty-project.workers.dev/api';

    function formatBytes(bytes) {
      if (bytes === 0) return '0 B';
      const units = ['B', 'KiB', 'MiB', 'GiB', 'TiB', 'PiB'];
      const i = Math.floor(Math.log(bytes) / Math.log(1024));
      return (bytes / Math.pow(1024, i)).toFixed(1) + ' ' + units[i];
    }

    function makeChart(canvasId, labels, data, color, opts = {}) {
      const ctx = document.getElementById(canvasId).getContext('2d');
      const gradient = ctx.createLinearGradient(0, 0, 0, 220);
      gradient.addColorStop(0, color + '40');
      gradient.addColorStop(1, color + '00');

      const isInteger = data.every(v => Number.isInteger(v));
      const maxVal = Math.max(...data);

      new Chart(ctx, {
        type: opts.type || 'line',
        data: {
          labels,
          datasets: [{
            data,
            borderColor: color,
            backgroundColor: opts.type === 'bar' ? color + '80' : gradient,
            borderWidth: opts.type === 'bar' ? 0 : 2.5,
            fill: opts.type !== 'bar',
            tension: 0,
            pointRadius: opts.type === 'bar' ? 0 : 4,
            pointBackgroundColor: color,
            pointBorderColor: '#1a1d27',
            pointBorderWidth: 2,
            pointHoverRadius: 6,
            borderRadius: opts.type === 'bar' ? 4 : 0,
          }],
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          interaction: { intersect: false, mode: 'index' },
          scales: {
            x: {
              ticks: { color: '#555', font: { size: 11 } },
              grid: { color: '#1f2230' },
              border: { color: '#2a2d37' },
            },
            y: {
              beginAtZero: true,
              ticks: {
                color: '#555',
                font: { size: 11 },
                callback: opts.yFormat || (v => isInteger ? (Number.isInteger(v) ? v : '') : v),
                maxTicksLimit: 6,
              },
              grid: { color: '#1f2230' },
              border: { color: '#2a2d37' },
              suggestedMax: isInteger ? maxVal + 1 : undefined,
            },
          },
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#1a1d27',
              borderColor: '#2a2d37',
              borderWidth: 1,
              titleColor: '#888',
              bodyColor: '#e0e0e0',
              bodyFont: { weight: '600' },
              padding: 10,
              displayColors: false,
              callbacks: opts.yFormat ? { label: (c) => opts.yFormat(c.parsed.y) } : {},
            },
          },
        },
      });
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }

    function compareVersionLabels(a, b) {
      const parse = label => {
        const match = String(label).match(/^(\d+)\.(\d+)\.(\d+)(?:[-+].*)?$/);
        return match ? match.slice(1).map(Number) : null;
      };
      const left = parse(a);
      const right = parse(b);
      if (left && right) {
        for (let i = 0; i < 3; i++) {
          if (left[i] !== right[i]) return right[i] - left[i];
        }
      } else if (left) {
        return -1;
      } else if (right) {
        return 1;
      }
      return String(b).localeCompare(String(a), undefined, { numeric: true });
    }

    function sortVersions(versions, sortBy) {
      return [...versions].sort((a, b) => {
        if (sortBy === 'count') {
          return b.instances - a.instances || compareVersionLabels(a.version, b.version);
        }
        return compareVersionLabels(a.version, b.version) || b.instances - a.instances;
      });
    }

    function renderBarList(entries, keyName) {
      if (!entries || entries.length === 0) return '<p class="loading" style="padding:1rem;">No data yet.</p>';
      const max = Math.max(...entries.map(e => e.instances));
      return `<div class="bar-list">${entries.map(e => {
        const pct = max > 0 ? (e.instances / max) * 100 : 0;
        return `
          <div class="bar-row">
            <span class="name">${escapeHtml(e[keyName])}</span>
            <span class="bar"><div style="width:${pct}%"></div></span>
            <span class="count">${e.instances}</span>
          </div>
        `;
      }).join('')}</div>`;
    }

    async function load() {
      try {
        const res = await fetch(`${API_BASE}/stats`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const { days, latest: latestBreakdown } = await res.json();

        if (!days || days.length === 0) {
          document.getElementById('content').innerHTML = '<p class="loading">No data yet. Check back once NASty instances start reporting.</p>';
          return;
        }

        const latest = days[days.length - 1];
        const labels = days.map(d => d.day);
        const versions = latestBreakdown?.versions ?? [];
        const arches = latestBreakdown?.arches ?? [];

        document.getElementById('content').innerHTML = `
          <div class="stats">
            <div class="stat-card">
              <div class="label">Active Instances</div>
              <div class="value">${latest.instances}</div>
            </div>
            <div class="stat-card">
              <div class="label">Total Drives</div>
              <div class="value">${latest.drives}</div>
            </div>
            <div class="stat-card">
              <div class="label">Total Storage</div>
              <div class="value">${formatBytes(latest.total_bytes)}</div>
            </div>
            <div class="stat-card">
              <div class="label">Used Storage</div>
              <div class="value">${formatBytes(latest.used_bytes)}</div>
            </div>
            <div class="stat-card">
              <div class="label">Total VMs</div>
              <div class="value">${latest.vms ?? 0}</div>
            </div>
            <div class="stat-card">
              <div class="label">Total Apps</div>
              <div class="value">${latest.apps ?? 0}</div>
            </div>
          </div>

          <div class="charts">
            <div class="chart-container">
              <h2>Active Instances</h2>
              <canvas id="chart-instances"></canvas>
            </div>

            <div class="chart-container">
              <h2>Total Drives</h2>
              <canvas id="chart-drives"></canvas>
            </div>

            <div class="chart-container full">
              <h2>Storage Managed</h2>
              <canvas id="chart-storage"></canvas>
            </div>
          </div>

          <div class="breakdown">
            <div class="chart-container">
              <div class="chart-heading">
                <h2>Versions (active instances)</h2>
                <div class="sort-toggle" role="group" aria-label="Sort versions">
                  <button type="button" class="active" data-version-sort="version" aria-pressed="true">Version</button>
                  <button type="button" data-version-sort="count" aria-pressed="false">Count</button>
                </div>
              </div>
              <div id="version-breakdown">${renderBarList(sortVersions(versions, 'version'), 'version')}</div>
            </div>
            <div class="chart-container">
              <h2>Architecture</h2>
              ${renderBarList(arches, 'arch')}
            </div>
          </div>
        `;

        const versionBreakdown = document.getElementById('version-breakdown');
        const versionSortButtons = document.querySelectorAll('[data-version-sort]');
        versionSortButtons.forEach(button => {
          button.addEventListener('click', () => {
            const sortBy = button.dataset.versionSort;
            versionBreakdown.innerHTML = renderBarList(sortVersions(versions, sortBy), 'version');
            versionSortButtons.forEach(candidate => {
              const active = candidate === button;
              candidate.classList.toggle('active', active);
              candidate.setAttribute('aria-pressed', String(active));
            });
          });
        });

        makeChart('chart-instances', labels, days.map(d => d.instances), '#818cf8', { type: 'bar' });
        makeChart('chart-drives', labels, days.map(d => d.drives), '#34d399', { type: 'bar' });
        makeChart('chart-storage', labels, days.map(d => d.total_bytes), '#fbbf24', { yFormat: v => formatBytes(v) });
      } catch (err) {
        document.getElementById('content').innerHTML = `<p class="error">Failed to load data: ${err.message}</p>`;
      }
    }

    load();
  </script>
</body>
</html>
